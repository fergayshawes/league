<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber League - اللاعبين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        input {
            -webkit-user-select: text;
            user-select: text;
        }

        :root {
            --bg-body: #040609;
            --bg-card: #0b0f17;
            --bg-nav: #090d14;
            --bg-sub: #0f1522;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #162030;
            --grid-opacity: 0.018;
            --dot-color: #ffffff;
            --pitch-bg: url('https://i.postimg.cc/WpGVVxBb/c17da56905c5df082ea221524ccf88cb.jpg') center/cover no-repeat;
            --card-glow: rgba(255, 255, 255, 0.15);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.7);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.85);
            --glow-line: #ffffff;
            --player-number-color: #0088ff;
        }

        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-nav: #ffffff;
            --bg-sub: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --grid-opacity: 0.05;
            --dot-color: #000000;
            --pitch-bg: url('https://i.postimg.cc/WpGVVxBb/c17da56905c5df082ea221524ccf88cb.jpg') center/cover no-repeat;
            --card-glow: rgba(15, 23, 42, 0.1);
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.12);
            --shadow-lg: 0 16px 40px rgba(15, 23, 42, 0.16);
            --glow-line: #0f172a;
            --player-number-color: #0066cc;
        }

        body {
            font-family: 'Noto Kufi Arabic', sans-serif;
            background-color: var(--bg-body); 
            color: var(--text-main);
            padding-bottom: 80px;
            overflow-x: hidden;
            position: relative;
        }

        #page-loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-body);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #page-loader.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .cyber-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--text-main);
            border-radius: 50%;
            animation: spinLoader 0.9s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spinLoader {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, var(--grid-opacity)) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, var(--grid-opacity)) 1px, transparent 1px);
            background-size: 35px 35px;
            z-index: -3;
            animation: gridMoving 20s linear infinite;
            will-change: background-position;
        }
        @keyframes gridMoving {
            0% { background-position: 0 0; }
            100% { background-position: 35px 35px; }
        }

        .top-laser-line {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 150px;
            background: linear-gradient(90deg, transparent, var(--glow-line), transparent);
            z-index: 99999;
            animation: laserMove 4s linear infinite;
        }
        @keyframes laserMove {
            0% { left: -150px; }
            100% { left: 100%; }
        }

        .scanlines-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -2; overflow: hidden;
        }
        .scanline-v, .scanline-h {
            position: absolute;
            will-change: left, top;
        }
        .scanline-v { 
            top: 0; width: 2px; height: 100%; 
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.18), transparent); 
            animation: scanV 6s infinite cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .scanline-h { 
            left: 0; height: 2px; width: 100%; 
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.18), transparent); 
            animation: scanH 9s infinite cubic-bezier(0.4, 0, 0.2, 1); 
        }
        @keyframes scanV { 0% { left: -15%; } 100% { left: 115%; } }
        @keyframes scanH { 0% { top: -15%; } 100% { top: 115%; } }

        .bg-particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -2;
        }
        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.035) 0%, transparent 75%);
            border-radius: 50%;
            animation: floatSlow 12s infinite ease-in-out;
            will-change: transform;
        }
        .particle:nth-child(1) { width: 450px; height: 450px; top: -5%; left: -10%; animation-duration: 10s; }
        .particle:nth-child(2) { width: 550px; height: 550px; top: 50%; left: 60%; animation-duration: 16s; }
        .particle:nth-child(3) { width: 350px; height: 350px; top: 20%; left: 80%; animation-duration: 12s; }

        @keyframes floatSlow {
            0%, 100% { transform: translate(0, 0) scale(1); rotate: 0deg; }
            50% { transform: translate(30px, -20px) scale(1.05); rotate: 180deg; }
        }

        nav {
            background-color: var(--bg-nav); 
            padding: 14px 16px;
            position: relative;
            box-shadow: var(--shadow-md);
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
        }

        nav::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffffff, transparent);
            animation: navLineMove 3s linear infinite;
        }
        @keyframes navLineMove {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        nav .nav-container { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        nav .brand-wrapper { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        nav .brand {
            font-size: 16px; font-weight: 800; color: var(--text-main);
            display: flex; align-items: center; gap: 8px;
        }

        .live-dot {
            width: 9px; height: 9px; background-color: var(--dot-color); border-radius: 50%;
            animation: dotSignal 1.2s infinite ease-in-out;
            display: inline-block;
            will-change: transform, opacity;
        }
        @keyframes dotSignal {
            0%, 100% { opacity: 0.3; transform: scale(0.7); box-shadow: 0 0 4px var(--dot-color); }
            50% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 16px var(--dot-color), 0 0 8px var(--dot-color); }
        }

        .header-actions { display: flex; align-items: center; gap: 8px; }
        
        .btn-header-icon {
            background: var(--bg-sub); color: var(--text-main); border: 1px solid var(--border-color);
            height: 36px; padding: 0 14px; border-radius: 10px; font-size: 13px; font-weight: 800;
            display: flex; align-items: center; justify-content: center; text-decoration: none;
            cursor: pointer; transition: all 0.2s ease; outline: none; box-shadow: var(--shadow-sm);
        }
        .btn-header-icon:hover {
            background: var(--text-main); color: var(--bg-body);
        }

        nav ul { list-style: none; display: flex; width: 100%; gap: 8px; }
        nav ul li { flex: 1; }
        nav ul li a {
            color: var(--text-muted); text-decoration: none; padding: 12px 4px; display: flex;
            align-items: center; justify-content: center; background: var(--bg-sub);
            border-radius: 8px; border: 1px solid var(--border-color);
            transition: all 0.15s ease; outline: none; box-shadow: var(--shadow-sm);
        }
        nav ul li a i { font-size: 18px; }
        nav ul li a:hover { color: var(--text-main); background: var(--bg-card); }
        nav ul li a.active {
            background: var(--text-main); color: var(--bg-body);
            font-weight: 800; border-color: var(--text-main);
        }

        .container { padding: 16px; margin-top: 5px; }
        .page { display: block; }

        .hero-section { 
            margin-bottom: 20px; 
            padding-right: 12px; 
            border-right: 4px solid var(--glow-line); 
            animation: titleLineGlow 2s ease-in-out infinite alternate;
        }
        @keyframes titleLineGlow {
            0% { border-right-color: var(--border-color); box-shadow: 2px 0 8px rgba(255,255,255,0); }
            100% { border-right-color: var(--glow-line); box-shadow: 4px 0 14px var(--card-glow); }
        }
        .hero-section h1 { font-size: 20px; font-weight: 800; color: var(--text-main); }
        .hero-section p { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

        .player-card {
            background: var(--bg-card); border-radius: 16px; padding: 16px 20px; border: 1px solid var(--border-color);
            position: relative; overflow: hidden; display: flex; flex-direction: row; 
            justify-content: space-between; align-items: center; cursor: pointer; box-shadow: var(--shadow-sm);
        }
        .player-card:hover { transform: translateY(-2px); border-color: var(--text-main); box-shadow: var(--shadow-md); }

        .search-container { margin-bottom: 16px; }
        .search-input { width: 100%; padding: 14px 18px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); font-family: 'Noto Kufi Arabic', sans-serif; font-size: 13px; outline: none; box-shadow: var(--shadow-sm); }
        .search-input:focus { border-color: var(--text-main); background: var(--bg-sub); box-shadow: var(--shadow-md); }

        .top-scorer-card { background: linear-gradient(135deg, #172030 0%, #080c12 100%); border: 2px solid var(--text-main); border-radius: 16px; padding: 20px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; position: relative; box-shadow: var(--shadow-lg); }
        [data-theme="light"] .top-scorer-card { background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); }
        .top-scorer-badge { background-color: var(--text-main); color: var(--bg-body); font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 5px; display: inline-block; margin-bottom: 6px; }
        .top-scorer-info h2 { font-size: 19px; font-weight: 800; color: var(--text-main); }
        .top-scorer-info p { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
        .top-scorer-goals { text-align: center; background: rgba(255, 255, 255, 0.08); border: 2px solid var(--border-color); padding: 10px 18px; border-radius: 10px; }
        .top-scorer-goals .goals-count { font-size: 25px; font-weight: 800; color: var(--text-main); display: block; line-height: 1; }

        .players-list { display: flex; flex-direction: column; gap: 12px; }
        .player-identity { display: flex; align-items: center; gap: 16px; }
        
        .player-jersey { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--border-color); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .player-jersey img { width: 100%; height: 100%; object-fit: cover; }
        .player-meta { display: flex; flex-direction: column; gap: 6px; }
        .player-meta h3 { margin: 0; color: var(--text-main); font-size: 15px; font-weight: 800; }
        
        .player-badges-container { display: flex; align-items: center; gap: 8px; }
        .info-badge { font-size: 10.5px; font-weight: 800; padding: 4px 10px; border-radius: 6px; background: var(--bg-sub); border: 1px solid var(--border-color); color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; }
        .info-badge.number-badge { color: var(--player-number-color); border-color: rgba(0, 136, 255, 0.3); }
        
        .stat-box { display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: var(--bg-sub); border: 1px solid var(--border-color); border-radius: 10px; min-width: 65px; padding: 8px 10px; }
        .stat-box .box-label { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
        .stat-box .box-value { font-size: 17px; color: var(--player-number-color); font-weight: 800; }

        .player-modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(2, 3, 5, 0.88); display: none; 
            justify-content: center; align-items: center; z-index: 11000; 
            backdrop-filter: blur(10px); 
        }
        .player-modal-overlay.active { display: flex; }

        .luxury-player-card {
            background: linear-gradient(145deg, #0e1420 0%, #05070a 100%);
            border: 2px solid var(--border-color); border-radius: 28px;
            width: 100%; max-width: 370px; padding: 40px 24px 30px 24px; text-align: center; 
            position: relative; overflow: hidden;
            box-shadow: var(--shadow-lg), 0 0 30px var(--card-glow);
        }
        [data-theme="light"] .luxury-player-card {
            background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%);
        }

        .luxury-avatar-container {
            width: 150px; height: 150px; margin: 10px auto 20px auto;
            border-radius: 50%; border: 4px solid var(--text-main); 
            position: relative; overflow: visible;
            box-shadow: 0 0 30px var(--card-glow);
        }
        .luxury-avatar-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        
        .luxury-jersey-badge {
            position: absolute; bottom: 4px; right: 4px;
            background: var(--player-number-color); color: #ffffff; font-size: 15px; font-weight: 800;
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 3px solid var(--bg-body); box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .luxury-name { font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 6px; }
        .luxury-team { font-size: 14px; color: var(--text-muted); margin-bottom: 25px; font-weight: 600; }
        
        .luxury-stats-row { display: flex; justify-content: center; gap: 16px; margin-bottom: 15px; }
        .luxury-stat-item {
            background: var(--bg-sub); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 16px 22px; flex: 1;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.01);
        }
        .luxury-stat-label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px; font-weight: 600; }
        .luxury-stat-value { font-size: 32px; font-weight: 800; color: var(--text-main); }

        .btn-close-luxury-corner {
            position: absolute; top: 16px; left: 16px;
            background: var(--bg-sub); color: #ef4444; border: 1px solid #ef4444;
            width: 32px; height: 32px; border-radius: 50%; font-size: 12px; font-weight: 800;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.15s ease; z-index: 100; outline: none;
        }
        .btn-close-luxury-corner:hover { background: #ef4444; color: #ffffff; }
    </style>
</head>
<body>

    <div id="page-loader">
        <div class="cyber-spinner"></div>
        <div class="loader-text">CYBER LEAGUE LOADING...</div>
    </div>

    <div class="top-laser-line"></div>

    <div class="scanlines-container">
        <div class="scanline-v"></div><div class="scanline-h"></div>
    </div>

    <div class="bg-particles">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    </div>

    <div class="player-modal-overlay" id="playerCardModal">
        <div class="luxury-player-card">
            <button class="btn-close-luxury-corner" onclick="closePlayerCardModal()">✕</button>
            <div class="luxury-avatar-container">
                <img id="luxImage" src="" alt="Player image">
                <div class="luxury-jersey-badge" id="luxJersey">#0</div>
            </div>
            <h2 class="luxury-name" id="luxName">ناوی یاریزان</h2>
            <p class="luxury-team" id="luxTeam">ناوی تیپ</p>
            <div class="luxury-stats-row">
                <div class="luxury-stat-item">
                    <span class="luxury-stat-label" id="lblPlayerGoalsCard">گۆڵەکانی یاریزان</span>
                    <span class="luxury-stat-value" id="luxGoals">0</span>
                </div>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-container">
            <div class="brand-wrapper">
                <div class="brand"><span class="live-dot"></span> <span id="lblBrandName">خولی فەرمی داتاکان - یاریزانەکان</span></div>
                <div class="header-actions">
                    <button class="btn-header-icon" id="langToggleBtn" onclick="toggleLanguage()">کوردی</button>
                    <button class="btn-header-icon" id="themeToggleBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
                    <a href="admin.html" class="btn-header-icon" id="lblAdminPanelLink" title="پانێڵی بەڕێوەبردن"><i class="fa-solid fa-gear"></i></a>
                </div>
            </div>
            <ul>
                <li><a href="index.html" id="nav-leagues" class="nav-link"><i class="fa-solid fa-trophy"></i></a></li>
                <li><a href="index.html" id="nav-matches" class="nav-link"><i class="fa-solid fa-calendar-days"></i></a></li>
                <li><a href="players.html" id="nav-players" class="nav-link active"><i class="fa-solid fa-users"></i></a></li>
                <li><a href="fantasy.html" id="nav-fantasy" class="nav-link"><i class="fa-solid fa-gamepad"></i></a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div id="players" class="page">
            <div class="hero-section">
                <h1 id="lblPlayersTitle">ئاماری یاریزانانی تیپەکان</h1>
                <p id="lblPlayersDesc">لیستی نوێکراوەی گۆڵکارانی فەرمی خول</p>
            </div>
            <div id="topScorerContainer"></div>
            <div class="search-container">
                <input type="text" id="playerSearch" class="search-input" onkeyup="filterPlayers()" placeholder="بگەڕێ بۆ ناوی یاریزان یان تیپ...">
            </div>
            <div class="players-list" id="playersGrid"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhYee5yLdNN-ttq6dux8G0w8_vl-ald-g",
            authDomain: "league-aec67.firebaseapp.com",
            databaseURL: "https://league-aec67-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "league-aec67",
            storageBucket: "league-aec67.firebasestorage.app",
            messagingSenderId: "825335921135",
            appId: "1:825335921135:web:2ad16d50a25adc3363de1a",
            measurementId: "G-ZLKJ3FJVW2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let playersDatabase = [];
        const defaultPlayerImage = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

        const domPlayersGrid = document.getElementById('playersGrid');
        const domTopScorerContainer = document.getElementById('topScorerContainer');

        window.showPlayerLuxuryCard = function(playerName, playerNumber, teamName) {
            const playerData = playersDatabase.find(p => p.name.trim() === playerName.trim());
            const goalsCount = playerData ? (playerData.goals || 0) : 0;
            const playerImgUrl = (playerData && playerData.photo) ? playerData.photo : defaultPlayerImage;

            document.getElementById('luxJersey').innerText = `#${playerNumber || '0'}`;
            document.getElementById('luxName').innerText = playerName;
            document.getElementById('luxTeam').innerText = `${teamName}`; 
            document.getElementById('luxGoals').innerText = goalsCount;
            document.getElementById('luxImage').src = playerImgUrl;

            document.getElementById('playerCardModal').classList.add('active');
        };

        window.closePlayerCardModal = function() {
            document.getElementById('playerCardModal').classList.remove('active');
        };

        function autoRenderPlayersAndStats() {
            if(!domPlayersGrid || !domTopScorerContainer) return; 
            domPlayersGrid.innerHTML = ""; domTopScorerContainer.innerHTML = "";
            const isAr = document.documentElement.getAttribute("lang") === "ar";

            if (playersDatabase.length === 0) {
                domPlayersGrid.innerHTML = `<p class="empty-message">ℹ️ ${isAr ? 'لا يوجد لاعبين حالياً في النظام.' : 'هیچ یاریزانێک لە ئێستادا لە سیستەمەکەدا نییە.'}</p>`;
                return;
            }

            playersDatabase.sort((a, b) => (b.goals || 0) - (a.goals || 0));
            const topScorer = playersDatabase[0];
            if (topScorer && (topScorer.goals > 0)) {
                domTopScorerContainer.innerHTML = `
                    <div class="top-scorer-card">
                        <div class="top-scorer-info">
                            <span class="top-scorer-badge">${isAr ? 'هداف الدوري' : 'گۆڵکاری خول'}</span>
                            <h2>${topScorer.name}</h2>
                            <p>${isAr ? 'الفريق' : 'تیپی'}: ${topScorer.team || (isAr ? 'بدون فريق' : 'بێ تیپ')} • ${isAr ? 'الرقم' : 'ژمارە'}: #${topScorer.number || '0'}</p>
                        </div>
                        <div class="top-scorer-goals">
                            <span class="goals-count">${topScorer.goals}</span>
                            <span class="goals-label">${isAr ? 'أهداف' : 'گۆڵ'}</span>
                        </div>
                    </div>
                `;
            }

            let listFragments = document.createDocumentFragment();
            playersDatabase.forEach((p) => {
                const card = document.createElement('div');
                card.className = "player-card";
                card.onclick = () => showPlayerLuxuryCard(p.name, p.number, p.team || (isAr ? 'بدون فريق' : 'بێ تیپ'));
                
                const imgSource = p.photo ? p.photo : defaultPlayerImage;
                card.innerHTML = `
                    <div class="player-identity">
                        <div class="player-jersey">
                            <img src="${imgSource}" alt="${p.name || 'Player'}">
                        </div>
                        <div class="player-meta">
                            <h3>${p.name || (isAr ? 'اسم اللاعب' : 'ناوی یاریزان')}</h3>
                            <div class="player-badges-container">
                                <span class="info-badge team-badge">${isAr ? 'الفريق' : 'تیپ'}: ${p.team || (isAr ? 'بدون فريق' : 'بێ تیپ')}</span>
                                <span class="info-badge number-badge">${isAr ? 'الرقم' : 'ژمارە'}: #${p.number || '0'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="player-data-chips">
                        <div class="stat-box">
                            <span class="box-label">${isAr ? 'أهداف' : 'گۆڵ'}</span>
                            <span class="box-value">${p.goals || 0}</span>
                        </div>
                    </div>
                `;
                listFragments.appendChild(card);
            });
            domPlayersGrid.appendChild(listFragments);
        }

        const dbRef = ref(db, '/');
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const matchesList = data.matchesDatabase ? Object.values(data.matchesDatabase) : [];
            const playersList = data.playersDatabase ? Object.values(data.playersDatabase) : [];

            let computedGoals = {};
            matchesList.forEach(m => {
                if(m.status === 'finished') {
                    if(m.homeEvents) Object.values(m.homeEvents).forEach(ev => { if(ev.type === 'goal' && ev.playerName) computedGoals[ev.playerName] = (computedGoals[ev.playerName] || 0) + 1; });
                    if(m.awayEvents) Object.values(m.awayEvents).forEach(ev => { if(ev.type === 'goal' && ev.playerName) computedGoals[ev.playerName] = (computedGoals[ev.playerName] || 0) + 1; });
                }
            });

            playersDatabase = playersList.map(p => { 
                return { 
                    ...p, 
                    goals: computedGoals[p.name] || 0,
                    photo: p.photo || "" 
                }; 
            });

            autoRenderPlayersAndStats();

            setTimeout(() => {
                const loader = document.getElementById("page-loader");
                if(loader) loader.classList.add("fade-out");
            }, 400);
        });
    </script>

    <script>
        const langData = {
            ckb: {
                brandName: "خولی فەرمی داتاکان - یاریزانەکان",
                adminTitle: "پانێڵی بەڕێوەبردن",
                playersTitle: "ئاماری یاریزانانی تیپەکان",
                playersDesc: "لیستی نوێکراوەی گۆڵکارانی فەرمی خول",
                searchPlaceholder: "بگەڕێ بۆ ناوی یاریزان یان تیپ...",
                playerGoalsCard: "گۆڵەکانی یاریزان",
                langBtnText: "کوردی"
            },
            ar: {
                brandName: "دوري البيانات الرسمي - اللاعبين",
                adminTitle: "لوحة التحكم للإدارة",
                playersTitle: "إحصائيات لاعبي الدوري",
                playersDesc: "القائمة المحدثة لهدافي الدوري الرسمي",
                searchPlaceholder: "ابحث عن اسم اللاعب أو الفريق...",
                playerGoalsCard: "أهداف اللاعب الحالية",
                langBtnText: "عربي"
            }
        };

        document.addEventListener("DOMContentLoaded", function() {
            const activeLang = localStorage.getItem("appLang") || "ckb";
            applyLanguage(activeLang);

            const currentTheme = localStorage.getItem("theme") || "dark";
            document.documentElement.setAttribute("data-theme", currentTheme);
            updateThemeIcon(currentTheme);
        });

        function toggleLanguage() {
            const currentLang = document.documentElement.getAttribute("lang") === "ar" ? "ckb" : "ar";
            applyLanguage(currentLang);
            localStorage.setItem("appLang", currentLang);
            autoRenderPlayersAndStats();
        }

        function applyLanguage(lang) {
            document.documentElement.setAttribute("lang", lang);
            document.documentElement.setAttribute("dir", "rtl");
            
            const trans = langData[lang];
            document.getElementById("lblBrandName").innerText = trans.brandName;
            document.getElementById("lblAdminPanelLink").setAttribute("title", trans.adminTitle);
            document.getElementById("lblPlayersTitle").innerText = trans.playersTitle;
            document.getElementById("lblPlayersDesc").innerText = trans.playersDesc;
            document.getElementById("playerSearch").setAttribute("placeholder", trans.searchPlaceholder);
            document.getElementById("lblPlayerGoalsCard").innerText = trans.playerGoalsCard;
            document.getElementById("langToggleBtn").innerText = trans.langBtnText;
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const btn = document.getElementById("themeToggleBtn");
            btn.innerHTML = theme === "dark" ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
        }

        function filterPlayers() {
            const filter = document.getElementById('playerSearch').value.trim().toLowerCase();
            const cards = document.getElementsByClassName('player-card');
            for (let i = 0; i < cards.length; i++) {
                const text = cards[i].innerText.toLowerCase();
                cards[i].style.display = text.includes(filter) ? "flex" : "none";
            }
        }
    </script>
</body>
</html>
